[project]
name = "schwab-refresh"
version = "0.1.0"
description = "Unattended Charles Schwab OAuth token minting via browser automation."
requires-python = ">=3.11"
dependencies = [
    "seleniumbase>=4.27",
    "cryptography>=42",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
schwab-refresh = "schwab_refresh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schwab_refresh"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:seleniumbase -p no:sb_pytest_plugin"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
